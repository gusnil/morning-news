name: build
on:
  schedule:
    - cron: "0 1 * * *"   # 03:00 CEST (summer)
    - cron: "0 2 * * *"   # 03:00 CET  (winter)
  workflow_dispatch:
  push:                    # design or source changes go live immediately
    branches: [main]
    paths: [templates/**, static/**, build/**, feeds.yaml]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: guard
        run: python build/dst_guard.py   # run=true only for the slot that is 03:xx Europe/Zurich, or on workflow_dispatch / push
      - if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt
      - if: steps.guard.outputs.run == 'true'
        run: python build/build.py
      - if: steps.guard.outputs.run == 'true'
        name: Commit cache
        run: |
          git config user.name "morning-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add cache/items.json cache/pages.json
          git commit -m "cache $(date -u +%F) [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
      - if: steps.guard.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
