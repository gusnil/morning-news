name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python build/build.py 2>&1 | tee build.log
      - run: |
          git config user.name "morning-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f cache build.log site/index.html && git commit -m "probe build output [skip ci]" && git push origin HEAD:probe
