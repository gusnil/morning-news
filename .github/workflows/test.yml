name: test
on:
  push:
    branches: [main]
    paths: ["build/**", "tests/**", "templates/**", "static/**", "feeds.yaml", "calendar.yaml", "requirements.txt"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
