# morning-news configuration: the single source of truth for sources, sections,
# weights and keyword rules. Changing the site = editing this file.
#
# Source fields
#   id          unique key (also used in cache/items.json)
#   name        display name
#   section     world | basel | sport | chess | ai
#   sub         sport only: cycling | teams | cfb | sumo
#   url         verified feed URL (null = not yet found)
#   homepage    used by build/validate_feeds.py to auto-discover a feed
#   candidates  extra feed URLs validate_feeds.py tries when url is null or dead
#   weight      1-5, ranking weight
#   lang        BCP-47 language of the items (drives the lang attribute)
#   region      world only: EU | ME | ASIA | AFR | LATAM | US (list allowed)
#   scope       basel only: Basel | BL | Local | CH
#   team        teams only: patriots | celtics | uconn | redsox | fcbasel | malmoff | sweden
#   discipline  sport: cycling | cfb | sumo | nfl  (matched against calendar.yaml)
#   include     regex (case-insensitive) on title+excerpt; item kept only if it matches
#   require     second regex that must also match (AND)
#   exclude     regex; item dropped if it matches
#   status      verified    feed checked from GitHub Actions on 2026-10-22, fetched nightly
#               stale       feed works but posts rarely; fetched nightly
#               unverified  could not be checked; fetched nightly
#               blocked     site refuses GitHub's runners (bot protection); not fetched,
#                           still re-checked by the weekly validate-feeds workflow
#               dropped     no feed exists; not fetched
#   note        free text

settings:
  timezone: Europe/Zurich
  archive_days: 7          # dated pages kept
  cache_days: 7            # items kept in cache/items.json
  fetch_timeout: 15        # seconds per feed
  fetch_workers: 8
  max_per_source: 3        # per section per day
  thin_threshold: 4        # fewer items than this shows the "thin day" note
  excerpt_max: 160         # excerpts longer than this are not shown
  user_agent: "Mozilla/5.0 (compatible; morning-news/1.0; +https://github.com/gusnil/morning-news)"

sections:
  - id: world
    title: World
    cap: 10
    window_hours: 36
    quota:
      region_max_share: 0.35
      region_required: [ASIA, AFR, LATAM, ME]
      multi_source_first: true

  - id: basel
    title: Basel
    cap: 10
    window_hours: 36
    quota:
      local_scopes: [Basel, BL, Local]
      min_local: 6

  - id: sport
    title: Sport
    window_hours: 36
    subsections:
      - id: cycling
        title: Cycling
        cap: 4
      - id: teams
        title: Teams
        cap: 6
        per_team: 1
        order: recent
        window_hours: 48
        release_to: [cfb]
      - id: cfb
        title: College football
        cap: 1
        cap_by_weekday: {6: 2, 0: 2}     # Python weekday(): 6 = Sunday, 0 = Monday
      - id: sumo
        title: Sumo
        cap: 1
        window_hours: 72
        off_event_max: 1
        off_event_require: "banzuke|promot|retire|yokozuna|ozeki"
    release_order: [cycling, teams, cfb, sumo]

  - id: chess
    title: Chess
    cap: 8
    window_hours: 48
    boost:
      - {value: 1, pattern: "Candidates|World Championship|Tata Steel|Norway Chess|Sinquefield|Grand Chess Tour|Freestyle|Champions Chess Tour|Titled Tuesday|Olympiad|Grand Swiss|World Cup|Rapid & Blitz|Rapid and Blitz|Bundesliga"}
    penalty:
      - {value: 2, pattern: "puzzle|lesson|course|how to|opening guide|tips"}

  - id: ai
    title: AI
    cap: 8
    window_hours: 120
    boost:
      - {value: 2, pattern: "decision|decision support|decision intelligence|\\bBI\\b|business intelligence|analytics|dashboard|Genie|lakehouse|Unity Catalog|Mosaic|\\bagents?\\b|agentic|forecasting|semantic layer|pharma|life sciences|\\bR&D\\b|clinical"}
    penalty:
      - {value: 2, pattern: "funding|raises|valuation|benchmark|leaderboard|parameters|\\bGPUs?\\b"}

# Calendar events give +2 to items of the same discipline and +2 to the sub-section cap.
event_boost: 2
event_cap_bonus: 2

