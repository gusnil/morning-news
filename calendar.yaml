# Hand-maintained event calendar (BRIEF §5.3). Update once a year.
#
# During an event window (start..end, plus the morning after, because the 03:00
# page reports the previous day) items of that discipline get +2 score and the
# sub-section cap rises by 2 (sumo: cap 2 during a basho).
#
#   discipline  cycling | sumo | cfb | nfl
#   boost       false = listed for reference only (non-major WorldTour races)
#   confirmed   false = date not officially confirmed; re-check before the event
#
# Populated 22.10.2026 for Nov 2026 - Oct 2027. Sources:
#   UCI WorldTour 2027: Wikipedia "2027 UCI World Tour", cross-checked with
#     Brujulabike / Domestique reports of the UCI-confirmed calendar (all 36 dates agree,
#     except Vuelta end: Wikipedia 24 Sep, the two UCI-calendar reports 26 Sep -> 26 used).
#   2027 Worlds (Haute-Savoie, 24 Aug - 5 Sep): UCI schedule as reported by Escape
#     Collective and Tuttobiciweb (20.07.2026).
#   2027 XCO World Cup: only a LEAKED DRAFT exists (PianetaMTB via Brujulabike, Oct 2026);
#     all rounds unconfirmed, venues mostly unassigned. 2026 series ended 3 Oct 2026.
#   Sumo: JSA 2027 Grand Tournament Schedule (via maezumou.com), Kyushu 2026 per Wikipedia
#     "2026 in sumo"; all match the second-Sunday rule.
#   CFP 2026-27: official schedule as reported by fbschedules.com.
#   NFL 2026 playoffs: Wikipedia "2026 NFL season" / "Super Bowl LXI".
#   No Olympics in this window (next: LA, July 2028).

